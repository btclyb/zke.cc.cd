<style>
@font-face{font-family:"Noto Serif Local";src:url("/fonts/noto-serif-latin-wght.woff2") format("woff2");
  font-weight:100 900;font-style:normal;font-display:swap;
  unicode-range:U+0000-00FF,U+0131,U+0152-0153,U+02C6,U+02DA,U+02DC,U+2013-2014,U+2018-201A,U+201C-201E,U+2022,U+2026,U+20AC,U+2212}
:root{
  --bg:#f3efe6; --ink:#26231f; --muted:#7a746a; --line:#d8d1c2; --accent:#c4402f;
  --up:#3f7a55; --down:#b6453b; --grain:.5;
  --font:"Noto Serif Local","Songti SC","STSong","Noto Serif CJK SC","Source Han Serif SC","Noto Serif SC","Hiragino Mincho ProN","Yu Mincho","SimSun",serif;
}
@media (prefers-color-scheme:dark){
  :root{--bg:#1c1a17; --ink:#e8e2d4; --muted:#968f82; --line:#38342d; --accent:#e0654f;
    --up:#8fc09a; --down:#e08a7e; --grain:.12}
}
*{box-sizing:border-box;margin:0}
html{scroll-behavior:smooth}
body{background:var(--bg);color:var(--ink);font-family:var(--font);font-size:1rem;line-height:1.95;letter-spacing:.04em;
  -webkit-font-smoothing:antialiased;padding:clamp(1.5rem,6vw,5rem)}
/* 和紙のような紙の質感 */
body::before{content:"";position:fixed;inset:0;pointer-events:none;opacity:var(--grain);mix-blend-mode:multiply;
  background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='160' height='160'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.8' numOctaves='2' stitchTiles='stitch'/><feColorMatrix values='0 0 0 0 .45  0 0 0 0 .4  0 0 0 0 .33  0 0 0 .45 0'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>")}
::selection{background:var(--accent);color:var(--bg)}
a{color:inherit;text-decoration-color:var(--line);text-decoration-thickness:1px;text-underline-offset:.4em;transition:color .3s,text-decoration-color .3s}
a:hover{color:var(--accent);text-decoration-color:var(--accent)}
:focus-visible{outline:1px solid var(--accent);outline-offset:4px}
main{max-width:54rem;margin:0 auto;position:relative;counter-reset:sec}

/* hero：大面积留白(間)，竖排文字，朱印 */
.hero{position:relative;min-height:70vh;display:flex;flex-direction:column;justify-content:flex-end;padding-bottom:clamp(3rem,8vw,6rem)}
h1{font-size:clamp(3.2rem,13vw,9rem);line-height:1;letter-spacing:-.02em;font-weight:200;
  cursor:default;user-select:none;margin-left:-.04em}
h1 span{display:inline-block;white-space:pre;will-change:font-variation-settings}
.tag{margin-top:2rem;color:var(--muted);line-height:1.8}
.tag b{display:block;color:var(--ink);font-weight:500;letter-spacing:.12em}
.tag .dim{display:block;margin-top:.2rem;font-size:.95rem;letter-spacing:.14em}
.vert{position:absolute;right:0;top:0;display:flex;flex-direction:column;align-items:center;gap:1.5rem}
.vert p{writing-mode:vertical-rl;letter-spacing:.6em;color:var(--muted);font-size:.95rem}
.hanko{display:grid;place-items:center;width:2.9rem;height:2.9rem;background:var(--accent);color:var(--bg);
  font-size:1.6rem;font-weight:700;line-height:1;border-radius:3px;transform:rotate(-4deg);letter-spacing:0}

/* sections */
section{counter-increment:sec;display:grid;grid-template-columns:8rem 1fr;gap:1rem 2rem;padding:3rem 0;border-top:1px solid var(--line)}
h2{font-size:1rem;font-weight:500;letter-spacing:.2em}
h2::before{content:counter(sec,cjk-decimal);display:block;color:var(--accent);font-size:.8rem;margin-bottom:.15rem}
.body>p{max-width:34rem}
.body>p+p{margin-top:1.2em}

.rows{list-style:none;padding:0}
.rows a,.rows .row{display:grid;grid-template-columns:1fr auto;gap:.1rem 1.5rem;padding:1rem 0;text-decoration:none;border-bottom:1px solid var(--line)}
.rows li:last-child>*{border-bottom:0}
.rows a:hover{color:var(--ink)}
.rows a:hover .t{color:var(--accent)}
.t{font-weight:500;transition:color .3s}
.d{color:var(--muted);font-size:.92rem;grid-column:1}
.m{color:var(--muted);font-size:.85rem;grid-row:1;grid-column:2;align-self:center}

/* quotes */
.q{display:grid;grid-template-columns:1fr 6.5rem 7rem;align-items:center;gap:.75rem 1.25rem;padding:1rem 0;border-bottom:1px solid var(--line)}
.rows li:last-child>.q{border-bottom:0}
.q .d{display:block}
.spark{width:100%;height:2rem;overflow:visible;color:var(--muted)}
.spark polyline{fill:none;stroke:currentColor;stroke-width:1.25;stroke-linejoin:round;stroke-linecap:round;vector-effect:non-scaling-stroke}
.px{text-align:right;font-variant-numeric:tabular-nums;letter-spacing:.02em}
.px .p{display:block;font-weight:500}
.px .c{font-size:.88rem;color:var(--muted)}
.q.up .spark,.q.up .c{color:var(--up)}
.q.down .spark,.q.down .c{color:var(--down)}
.note{margin-top:.75rem;font-size:.82rem;color:var(--muted)}

footer{padding-top:2rem;border-top:1px solid var(--line);color:var(--muted);font-size:.85rem;display:flex;justify-content:space-between;gap:1rem;flex-wrap:wrap}

@media (max-width:40rem){
  section{grid-template-columns:1fr;gap:.5rem;padding:2.25rem 0}
  .rows a,.rows .row{grid-template-columns:1fr}
  .m{grid-row:auto;grid-column:1}
  .q{grid-template-columns:1fr 4.5rem 6rem;gap:.5rem .75rem}
}
</style>
</head>
<body>

    </div>
    <h1 id="name" data-text="Liu Yb" aria-label="Liu Yb"></h1>
    <p class="tag"><b>Digital Nomad</b><span class="dim">Crypto · US Stocks · AI</span></p>
  </header>

  <section>

  <section>

    <div class="body">

</main>

<script>
(() => {
  const h = document.getElementById('name');
  const text = h.dataset.text;
  const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
  const spans = [...text].map(ch => {
    const s = document.createElement('span');
    s.textContent = ch; s.setAttribute('aria-hidden', 'true');
    h.appendChild(s); return s;
  });
  const n = spans.length;
  const cur = new Array(n).fill(0), tgt = new Array(n).fill(0);
  let mx = -9999, my = -9999, raf = 0, t0 = performance.now(), intro = !reduce;
  const apply = (s, t) => { s.style.fontVariationSettings = `"wght" ${Math.round(200 + t * 400)}`; };
  const bump = x => Math.max(0, 1 - Math.abs(x) / 1.6);

  function tick(now) {
    const el = now - t0;
    if (intro && el > 2200) intro = false;
    let moving = intro;
    spans.forEach((s, i) => {
      if (intro) tgt[i] = bump((el / 2200) * (n + 3) - 1.5 - i);
      else {
        const r = s.getBoundingClientRect();
        const d = Math.hypot(mx - (r.left + r.width / 2), my - (r.top + r.height / 2));
        tgt[i] = Math.max(0, 1 - d / 240);
      }
      const diff = tgt[i] - cur[i];
      if (Math.abs(diff) > 0.003) { cur[i] += diff * 0.12; moving = true; apply(s, cur[i]); }
    });
    raf = moving ? requestAnimationFrame(tick) : 0;
  }
  const kick = () => { if (!raf) raf = requestAnimationFrame(tick); };

  if (reduce) spans.forEach(s => apply(s, 0.3));
  else {
    addEventListener('pointermove', e => { mx = e.clientX; my = e.clientY; kick(); }, { passive: true });
    addEventListener('pointerleave', () => { mx = my = -9999; kick(); });
    kick();
  }
  document.getElementById('y').textContent = new Date().getFullYear();
})();
</script>
<script>
(() => {
  const note = document.getElementById('qnote');
  const rows = document.querySelectorAll('.q');
  const NS = 'http://www.w3.org/2000/svg';

  function spark(svg, h) {
    svg.replaceChildren();
    if (!Array.isArray(h) || h.length < 2) return;
    const min = Math.min(...h), max = Math.max(...h), span = (max - min) || 1;
    const pts = h.map((v, i) => `${(i / (h.length - 1) * 120).toFixed(1)},${(30 - (v - min) / span * 28).toFixed(1)}`).join(' ');
    const pl = document.createElementNS(NS, 'polyline');
    pl.setAttribute('points', pts);
    svg.appendChild(pl);
  }

  function render(data) {
    rows.forEach(r => {
      const d = data[r.dataset.k];
      if (!d) return;
      const ch = Number(d.change);
      r.classList.remove('up', 'down');
      if (ch > 0) r.classList.add('up'); else if (ch < 0) r.classList.add('down');
      r.querySelector('.p').textContent = d.price;
      r.querySelector('.c').textContent = (ch > 0 ? '+' : '') + ch.toFixed(2) + '%';
      spark(r.querySelector('.spark'), d.history);
    });
    const t = new Date().toLocaleTimeString('zh-CN', { hour: '2-digit', minute: '2-digit' });
    note.textContent = `更新于 ${t}。数据来自行情接口，仅供参考。`;
  }

  async function load() {
    for (const url of ['/api/quotes', 'https://api.zke.cc.cd']) {
      try {
        const r = await fetch(url, { cache: 'no-store' });
        if (!r.ok) continue;
        render(await r.json());
        return;
      } catch (e) { /* 试下一个 */ }
    }
    note.textContent = '行情暂时无法加载，稍后刷新重试。';
  }
  load();
  setInterval(load, 60000);
})();
</script>
